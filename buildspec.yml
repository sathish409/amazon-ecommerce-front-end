version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo Installing dependencies...
      - node -v
      - npm -v
      - npm i -g npm@10
      - npm -v
      - npm install

  build:
    commands:
      - echo Building React app...
      - npm run build

  post_build:
    commands:
      - echo Deploying to S3...
      - aws s3 sync build/ s3://ecommerce-fegl-bucket --delete

artifacts:
  files:
    - "**/*"
